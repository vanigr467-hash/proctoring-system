version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bloodbridge-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: bloodbridge123
      MONGO_INITDB_DATABASE: bloodbridge
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - bloodbridge-network

  bloodbridge-app:
    build: .
    container_name: bloodbridge-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MONGODB_URI=mongodb://admin:bloodbridge123@mongodb:27017/bloodbridge?authSource=admin
      - SECRET_KEY=bloodbridge-production-secret-key-2024
      - JWT_SECRET_KEY=jwt-production-secret-key-2024
    depends_on:
      - mongodb
    volumes:
      - ./logs:/app/logs
    networks:
      - bloodbridge-network

volumes:
  mongodb_data:
    driver: local

networks:
  bloodbridge-network:
    driver: bridge
