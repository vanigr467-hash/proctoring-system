services:
  postgres:
    image: postgres:14
    container_name: proctoring_db
    environment:
      POSTGRES_DB: proctoringdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proctoring_network

  redis:
    image: redis:7-alpine
    container_name: proctoring_redis
    ports:
      - "6379:6379"
    networks:
      - proctoring_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proctoring_backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: proctoringdb
      DB_USER: postgres
      DB_PASSWORD: postgres123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - proctoring_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proctoring_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - proctoring_network

volumes:
  postgres_data:

networks:
  proctoring_network:
    driver: bridge
